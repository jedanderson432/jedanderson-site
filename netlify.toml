[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Bump CACHE_BUST to force Astro content-layer cache invalidation when
  # only frontmatter has changed in a content collection (Astro's cache
  # can otherwise carry stale tags/dates across builds on Netlify).
  CACHE_BUST = "2026-05-29-v1"

# Magnifica Vita was re-typed from letter to essay on 2026-05-29. Its
# canonical URL moved from /letters/ to /essays/. Permanent redirects
# preserve the old URLs (HTML and raw markdown). force = true so the
# rule applies regardless of any cached artifact at the old path.
[[redirects]]
  from = "/letters/magnifica-vita"
  to = "/essays/magnifica-vita"
  status = 301
  force = true

[[redirects]]
  from = "/letters/magnifica-vita.md"
  to = "/essays/magnifica-vita.md"
  status = 301
  force = true

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
