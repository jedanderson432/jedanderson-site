[build]
  command = "npm run build"
  publish = "dist"

# Search-engine ownership verification (optional). Set these in the
# Netlify UI (Site settings → Environment variables) — NOT here, so the
# tokens stay out of the repo. When present, BaseLayout emits the
# corresponding meta tags on every page; no code change needed:
#   PUBLIC_GOOGLE_SITE_VERIFICATION → <meta name="google-site-verification">
#   PUBLIC_BING_SITE_VERIFICATION   → <meta name="msvalidate.01">
# Setup steps: docs/DISCOVERABILITY.md.

[build.environment]
  NODE_VERSION = "20"
  # Bump CACHE_BUST to force Astro content-layer cache invalidation when
  # only frontmatter has changed in a content collection (Astro's cache
  # can otherwise carry stale tags/dates across builds on Netlify).
  CACHE_BUST = "2026-05-29-v1"

# Magnifica Vita was re-typed from letter to essay on 2026-05-29. Its
# canonical URL moved from /letters/ to /essays/. Permanent redirects
# preserve the old URLs (HTML and raw markdown). force = true so the
# rule applies regardless of any cached artifact at the old path.
[[redirects]]
  from = "/letters/magnifica-vita"
  to = "/essays/magnifica-vita"
  status = 301
  force = true

[[redirects]]
  from = "/letters/magnifica-vita.md"
  to = "/essays/magnifica-vita.md"
  status = 301
  force = true

# Sitemap path aliases. The real sitemap is /sitemap-index.xml (emitted by
# the Astro sitemap integration). Crawlers routinely hard-guess the common
# conventional names and 404. These permanent redirects funnel every guess
# to the canonical index. force = true so the rule applies even if a stale
# artifact ever exists at the guessed path.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

[[redirects]]
  from = "/sitemaps.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Trailing-slash normalisation. Canonical form is no trailing slash
# (matches DOI/Zenodo metadata, BibTeX blocks, llms.txt, HF dataset).
# Pages build as <path>.html (build.format = 'file'), so the slash form
# has no file behind it and these rules fire. Placed after all other
# redirects; never redirect "/" itself.

[[redirects]]
  from = "/essays/:slug/"
  to = "/essays/:slug"
  status = 301

[[redirects]]
  from = "/essays/"
  to = "/essays"
  status = 301

[[redirects]]
  from = "/posts/:slug/"
  to = "/posts/:slug"
  status = 301

[[redirects]]
  from = "/posts/"
  to = "/posts"
  status = 301

[[redirects]]
  from = "/books/:slug/"
  to = "/books/:slug"
  status = 301

[[redirects]]
  from = "/books/"
  to = "/books"
  status = 301

[[redirects]]
  from = "/letters/:slug/"
  to = "/letters/:slug"
  status = 301

[[redirects]]
  from = "/letters/"
  to = "/letters"
  status = 301

[[redirects]]
  from = "/speeches/:slug/"
  to = "/speeches/:slug"
  status = 301

[[redirects]]
  from = "/speeches/"
  to = "/speeches"
  status = 301

[[redirects]]
  from = "/tags/:slug/"
  to = "/tags/:slug"
  status = 301

[[redirects]]
  from = "/tags/"
  to = "/tags"
  status = 301

[[redirects]]
  from = "/:page/"
  to = "/:page"
  status = 301

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# The llms indexes are regenerated every build. Keep their cache short so
# a freshly published essay (or a structural change like the ## Optional
# reorg) propagates within the hour instead of being pinned behind a long
# max-age at the CDN edge.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/.well-known/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Adds Link: <html twin>; rel="canonical" to every .md response.
# Static asset directories are excluded so the function only runs on pages.
[[edge_functions]]
  path = "/*"
  function = "md-canonical"
  excludedPath = ["/_astro/*", "/images/*", "/pdfs/*", "/fonts/*", "/data/*", "/decks/*", "/downloads/*", "/visual-essays/*", "/pagefind/*"]
